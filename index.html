<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXO - Multiempresa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0f172a;
  overflow: hidden;
}

.login-shell {
  display: grid;
  grid-template-columns: 1fr 1fr;
  width: 100%;
  max-width: 780px;
  min-height: 480px;
  border-radius: 20px;
  overflow: hidden;
  border: 0.5px solid rgba(255,255,255,0.1);
  box-shadow: 0 40px 80px rgba(0,0,0,0.5);
  animation: fadeUp 0.4s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ===== LEFT PANEL ===== */
.login-left {
  background: #1e293b;
  padding: 48px 40px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.brand-mark {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-icon {
  width: 36px;
  height: 36px;
  background: #6366f1;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 700;
  color: white;
  letter-spacing: -1px;
}

.brand-name {
  font-size: 18px;
  font-weight: 600;
  color: white;
  letter-spacing: -0.3px;
}

.brand-badge {
  display: inline-block;
  background: rgba(99,102,241,0.15);
  color: #a5b4fc;
  border: 0.5px solid rgba(99,102,241,0.3);
  border-radius: 20px;
  font-size: 11px;
  padding: 3px 10px;
  margin-top: 8px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.left-stats {
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin-top: 40px;
}

.stat-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.stat-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #6366f1;
  flex-shrink: 0;
}
.stat-dot.green { background: #10b981; }
.stat-dot.amber { background: #f59e0b; }

.stat-label {
  color: rgba(255,255,255,0.45);
  font-size: 13px;
}

.stat-value {
  color: white;
  font-size: 13px;
  font-weight: 500;
  margin-left: auto;
}

.left-footer {
  color: rgba(255,255,255,0.3);
  font-size: 12px;
  line-height: 1.7;
}

/* ===== RIGHT PANEL ===== */
.login-right {
  background: #0f172a;
  padding: 48px 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.form-header {
  margin-bottom: 24px;
}

.form-header h2 {
  font-size: 22px;
  font-weight: 600;
  color: white;
  margin: 0 0 6px;
  letter-spacing: -0.3px;
}

.form-header p {
  font-size: 13px;
  color: rgba(255,255,255,0.35);
  margin: 0;
}

/* ===== TABS ===== */
.tab-row {
  display: flex;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  padding: 3px;
  margin-bottom: 24px;
}

.tab {
  flex: 1;
  padding: 8px;
  text-align: center;
  font-size: 13px;
  color: rgba(255,255,255,0.35);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}

.tab.active {
  background: #6366f1;
  color: white;
  font-weight: 500;
}

/* ===== FIELDS ===== */
.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  font-size: 11px;
  color: rgba(255,255,255,0.35);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 6px;
}

.field input {
  width: 100%;
  background: rgba(255,255,255,0.06);
  border: 0.5px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  padding: 11px 14px;
  color: white;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}

.field input:focus {
  border-color: #6366f1;
  background: rgba(99,102,241,0.08);
}

.field input::placeholder {
  color: rgba(255,255,255,0.2);
}

/* ===== BUTTON ===== */
.btn-primary {
  width: 100%;
  padding: 12px;
  background: #6366f1;
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.2s, transform 0.1s;
  letter-spacing: 0.2px;
}

.btn-primary:hover { background: #4f46e5; }
.btn-primary:active { transform: scale(0.99); }

/* ===== RESPONSIVE ===== */
@media (max-width: 640px) {
  .login-shell {
    grid-template-columns: 1fr;
    border-radius: 0;
    min-height: 100vh;
  }
  .login-left { display: none; }
  .login-right { padding: 40px 28px; }
}
</style>
</head>

<body>

<div class="login-shell">

  <!-- LEFT: Branding + stats -->
  <div class="login-left">
    <div>
      <div class="brand-mark">
        <div class="brand-icon">M</div>
        <span class="brand-name">MiCRM</span>
      </div>
      <div class="brand-badge">Multiempresa SaaS</div>

      <div class="left-stats">
        <div class="stat-row">
          <div class="stat-dot green"></div>
          <span class="stat-label">Conversaciones activas</span>
          <span class="stat-value">847</span>
        </div>
        <div class="stat-row">
          <div class="stat-dot"></div>
          <span class="stat-label">Canales conectados</span>
          <span class="stat-value">3</span>
        </div>
        <div class="stat-row">
          <div class="stat-dot amber"></div>
          <span class="stat-label">Tickets sin atender</span>
          <span class="stat-value">12</span>
        </div>
      </div>
    </div>

    <div class="left-footer">
      Gestiona WhatsApp, Instagram y<br>
      Facebook Messenger desde un solo lugar.
    </div>
  </div>

  <!-- RIGHT: Form -->
  <div class="login-right">

    <div class="form-header">
      <h2 id="formTitle">Bienvenido de nuevo</h2>
      <p id="formSubtitle">Ingresa con los datos de tu empresa</p>
    </div>

    <div class="tab-row">
      <div class="tab active" onclick="switchTab('login', this)">Iniciar sesión</div>
      <div class="tab" onclick="switchTab('register', this)">Crear empresa</div>
    </div>

    <!-- LOGIN -->
    <div id="loginFields">
      <div class="field">
        <label>Empresa / Dominio</label>
        <input type="text" placeholder="miempresa">
      </div>
      <div class="field">
        <label>Correo</label>
        <input type="email" placeholder="admin@miempresa.com">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" placeholder="••••••••">
      </div>
      <a href="menssage.html" style="text-decoration:none;">
        <button class="btn-primary">Entrar →</button>
      </a>
    </div>

    <!-- REGISTER -->
    <div id="registerFields" style="display:none;">
      <div class="field">
        <label>Nombre de la empresa</label>
        <input type="text" placeholder="Ej. Grupo Michel">
      </div>
      <div class="field">
        <label>Administrador</label>
        <input type="text" placeholder="Tu nombre completo">
      </div>
      <div class="field">
        <label>Correo</label>
        <input type="email" placeholder="admin@tuempresa.com">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" placeholder="••••••••">
      </div>
      <button class="btn-primary">Crear cuenta →</button>
    </div>

  </div>
</div>

<script>
function switchTab(mode, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const isLogin = mode === 'login';
  document.getElementById('loginFields').style.display = isLogin ? 'block' : 'none';
  document.getElementById('registerFields').style.display = isLogin ? 'none' : 'block';
  document.getElementById('formTitle').textContent = isLogin ? 'Bienvenido de nuevo' : 'Crear empresa';
  document.getElementById('formSubtitle').textContent = isLogin
    ? 'Ingresa con los datos de tu empresa'
    : 'Configura tu cuenta en segundos';
}
</script>

</body>
</html>
